        // Data storage
        let allData = {};
        let currentCategory = 'all';
        let searchQuery = '';

        // Load data from JSON files
        async function loadData() {
            const files = ['data/data.json', 'data/data2.json', 'data/data3.json', 'data/docker.json'];
            const categoryNames = {
                'data/data.json': 'university',
                'data/data2.json': 'cdn',
                'data/data3.json': 'pypi',
                'data/docker.json': 'docker'
            };

            for (const file of files) {
                try {
                    const response = await fetch(`/${file}`);
                    const data = await response.json();
                    const category = categoryNames[file];
                    allData[category] = data.sites || [];
                } catch (error) {
                    console.error(`Failed to load ${file}:`, error);
                }
            }

            renderContent();
            updateStats();
        }

        function getCategoryName(category) {
            const names = {
                'university': '🏫 大学/企业开源软件镜像',
                'cdn': '⚡ CDN 镜像',
                'pypi': '🐍 PyPI 镜像',
                'docker': '🐳 Docker 镜像'
            };
            return names[category] || category;
        }

        // Filter sites based on search query
        function filterSites(sites) {
            if (!searchQuery) return sites;
            const query = searchQuery.toLowerCase();
            return sites.filter(site => 
                site.name.toLowerCase().includes(query) ||
                (site.url && site.url.toLowerCase().includes(query))
            );
        }

        // Render content
        function renderContent() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = '';

            if (currentCategory === 'all') {
                // Render all categories
                for (const [category, sites] of Object.entries(allData)) {
                    const filteredSites = filterSites(sites);
                    if (filteredSites.length > 0) {
                        contentArea.innerHTML += renderCategory(category, filteredSites);
                    }
                }
            } else {
                // Render single category
                const sites = allData[currentCategory] || [];
                const filteredSites = filterSites(sites);
                if (filteredSites.length > 0) {
                    contentArea.innerHTML = renderCategory(currentCategory, filteredSites);
                }
            }
        }

        // Render a category section
        function renderCategory(category, sites) {
            return `
                <section class="bg-white rounded-2xl shadow-lg overflow-hidden">
                    <div class="bg-gradient-to-r from-primary-600 to-primary-800 px-6 py-4">
                        <h2 class="text-xl font-bold text-white flex items-center">
                            ${getCategoryName(category)}
                            <span class="ml-3 bg-white/20 text-white text-sm px-3 py-1 rounded-full">
                                ${sites.length} 个
                            </span>
                        </h2>
                    </div>
                    <div class="p-6">
                        <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                            ${sites.map(site => renderSiteCard(site)).join('')}
                        </div>
                    </div>
                </section>
            `;
        }

        // Render a site card
        function renderSiteCard(site) {
            const statusClass = site.status === 'Online' ? 'status-online' : 'status-offline';
            const statusText = site.status === 'Online' ? '在线' : '离线';
            const copyText = site.url || '#';
            
            return `
                <div class="card-hover bg-gradient-to-br from-white to-gray-50 rounded-xl border border-gray-100 p-5">
                    <div class="flex items-start justify-between mb-3">
                        <h3 class="font-semibold text-gray-800 text-lg truncate flex-1 mr-2">${site.name}</h3>
                        <span class="${statusClass} text-white text-xs px-2 py-1 rounded-full whitespace-nowrap flex items-center">
                            <span class="w-2 h-2 bg-white rounded-full mr-1 ${site.status === 'Online' ? 'animate-pulse' : ''}"></span>
                            ${statusText}</span>
                    </div>
                    
                    <div class="space-y-2">
                        <div class="flex items-center text-sm">
                            <span class="text-gray-500 w-12 flex-shrink-0">官网:</span>
                            <a href="${site.home || '#'}" target="_blank" class="text-primary-600 hover:text-primary-800 truncate flex-1">
                                ${site.home || '无'}
                            </a>
                        </div>
                        <div class="flex items-center text-sm">
                            <span class="text-gray-500 w-12 flex-shrink-0">地址:</span>
                            <code class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-xs flex-1 truncate mr-2">${site.url || '无'}</code>
                            <button onclick="copyToClipboard('${copyText}')" 
                                class="copy-btn bg-primary-100 text-primary-600 hover:bg-primary-200 p-1.5 rounded-lg flex-shrink-0"
                                title="复制链接">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                                </svg>
                            </button>
                        </div>
                        ${site.tips && site.tips !== '无' ? `
                        <div class="flex items-start text-sm">
                            <span class="text-gray-500 w-12 flex-shrink-0">备注:</span>
                            <span class="text-orange-600">${site.tips}</span>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Update statistics
        function updateStats() {
            let total = 0, online = 0, offline = 0;
            
            for (const sites of Object.values(allData)) {
                total += sites.length;
                sites.forEach(site => {
                    if (site.status === 'Online') online++;
                    else offline++;
                });
            }

            document.getElementById('totalCount').textContent = total;
            document.getElementById('onlineCount').textContent = online;
            document.getElementById('offlineCount').textContent = offline;
            document.getElementById('categoryCount').textContent = Object.keys(allData).length;
        }

        // Copy to clipboard
        function copyToClipboard(text) {
            if (text === '#') {
                showToast('无法复制无效链接', 'error');
                return;
            }
            
            navigator.clipboard.writeText(text).then(() => {
                showToast('链接已复制到剪贴板');
            }).catch(() => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('链接已复制到剪贴板');
            });
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            toast.className = `fixed bottom-4 right-4 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'} text-white px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 z-50`;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2000);
        }

        // Close ad banner
        function closeAdBanner() {
            const adBanner = document.getElementById('adBanner');
            adBanner.style.display = 'none';
            localStorage.setItem('adBannerClosed', 'true');
        }

        // Check if ad banner was closed
        function checkAdBannerStatus() {
            if (localStorage.getItem('adBannerClosed') === 'true') {
                const adBanner = document.getElementById('adBanner');
                if (adBanner) {
                    adBanner.style.display = 'none';
                }
            }
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            checkAdBannerStatus();

            // Search input
            const searchInput = document.getElementById('searchInput');
            let debounceTimer;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    searchQuery = e.target.value;
                    renderContent();
                }, 300);
            });

            // Category tabs
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.category-btn').forEach(b => {
                        b.classList.remove('bg-primary-600', 'text-white');
                        b.classList.add('bg-gray-100', 'text-gray-600');
                    });
                    btn.classList.remove('bg-gray-100', 'text-gray-600');
                    btn.classList.add('bg-primary-600', 'text-white');
                    
                    currentCategory = btn.dataset.category;
                    renderContent();
                });
            });
        });
    </script>
</body>
</html>
